name: Add five requested web apps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-five-web-apps.yml']
permissions:
  contents: write
concurrency:
  group: add-five-web-apps
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the five requested sites and update the reviewed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          """One-time, fail-closed catalog update for the five explicitly requested repositories."""
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from html.parser import HTMLParser
          import hashlib, json, os, re, urllib.request
          
          ROOT = Path.cwd()
          SPECS = [
              ('TwinForge', 'TwinForge', 'office', 'Dual-pane file manager with tabs, archives and permission-based local-folder access'),
              ('Branchglass', 'Branchglass', 'development', 'Git workspace with commit history, branches, staging and diffs'),
              ('NotepadXP', 'Notepad XP', 'office', 'Classic plain-text editor with find, replace, encodings and WebGPU text rendering'),
              ('Formalyth', 'Formalyth', 'cad', 'Parametric CAD design and manufacturing workbench'),
              ('Jailbreak', 'Jailbreak', 'development', 'C#, XAML and MSIL to JavaScript compilers with a browser IDE'),
          ]
          class Title(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active = False; self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'title': self.active = True
              def handle_endtag(self, tag):
                  if tag == 'title': self.active = False
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
          
          def read_url(url, api=False):
              headers = {'User-Agent': 'Aster-reviewed-web-app-catalog'}
              if api:
                  assert url.startswith('https://api.github.com/repos/wieslawsoltes/')
                  headers.update(Accept='application/vnd.github+json')
                  if os.environ.get('GH_TOKEN'): headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=40) as r:
                  data = r.read(16 * 1024 * 1024 + 1)
                  assert r.status == 200 and len(data) <= 16 * 1024 * 1024, url
                  return data, r.geturl(), dict(r.headers.items())
          
          def replace(text, old, new, count=None):
              found = text.count(old)
              assert found > 0 and (count is None or found == count), f'Unexpected source: {old!r}, count {found}'
              return text.replace(old, new)
          
          path = ROOT / 'src/web-app-catalog.js'
          text = path.read_text()
          prefix, rest = text.split('    const data = ', 1)
          raw, suffix = rest.split(';\n    for (const app', 1)
          catalog = json.loads(raw)
          inventory = json.loads((ROOT / 'docs/web-app-inventory.json').read_text())
          assert len(catalog['apps']) == 69 and len(inventory['repositories']) == 70
          assert not {s[0] for s in SPECS}.intersection(a['repo'] for a in catalog['apps'])
          original = {a['repo']: a.copy() for a in catalog['apps']}
          now = datetime.now(timezone.utc).isoformat()
          audits = []
          for repo, title, category, description in SPECS:
              api = 'https://api.github.com/repos/wieslawsoltes/' + repo
              meta = json.loads(read_url(api, True)[0])
              readme = json.loads(read_url(api + '/readme', True)[0])
              assert meta['full_name'] == 'wieslawsoltes/' + repo and not meta['private'] and not meta['fork']
              assert meta['has_pages'] and not meta['disabled']
              url = 'https://wieslawsoltes.github.io/' + repo + '/'
              data, final, headers = read_url(url)
              headers = {k.lower(): v for k, v in headers.items()}
              assert final == url and 'text/html' in headers.get('content-type', '')
              assert not headers.get('x-frame-options')
              assert not re.search(r"frame-ancestors\s+'none'", headers.get('content-security-policy', ''))
              parser = Title(); parser.feed(data.decode('utf-8-sig')); document_title = ''.join(parser.parts).strip()
              assert document_title and 'Site not found' not in document_title
              created = datetime.fromisoformat(meta['created_at'].replace('Z', '+00:00'))
              assert datetime.fromisoformat(catalog['startInclusive']) <= created < datetime.fromisoformat(catalog['endExclusive']), 'Creation date outside original audit window: ' + repo
              app = dict(repo=repo, title=title, description=description, category=category,
                         createdAt=meta['created_at'], url=url, documentTitle=document_title)
              i = max(i for i, a in enumerate(catalog['apps']) if a['category'] == category) + 1
              catalog['apps'].insert(i, app)
              evidence = dict(name=repo, createdAt=meta['created_at'], createdLocal=created.astimezone(ZoneInfo('Europe/Warsaw')).isoformat(),
                              repository=meta['html_url'], readmeSHA=readme['sha'], included=True,
                              reason='Explicitly requested by the owner; public browser application with a deployed HTML entry point.',
                              auditedAt=now, deployments=[dict(requestedUrl=url, status=200, finalUrl=final,
                              headers={k: headers[k] for k in ['content-type','x-frame-options','content-security-policy'] if k in headers},
                              bytes=len(data), sha256=hashlib.sha256(data).hexdigest(), title=document_title)])
              inventory['repositories'].append(evidence); audits.append(evidence)
              print('Verified deployment:', repo, title, category, document_title, flush=True)
          assert len(catalog['apps']) == 74 and len({a['repo'] for a in catalog['apps']}) == 74
          assert all(next(a for a in catalog['apps'] if a['repo'] == name) == old for name, old in original.items())
          catalog['updatedAt'] = inventory['updatedAt'] = now
          inventory['repositories'].sort(key=lambda r: r['name'].lower())
          path.write_text(prefix + '    const data = ' + json.dumps(catalog, ensure_ascii=False, indent=2) + ';\n    for (const app' + suffix)
          (ROOT / 'docs/web-app-inventory.json').write_text(json.dumps(inventory, ensure_ascii=False, indent=2) + '\n')
          
          p = ROOT / 'sw.js'; p.write_text(replace(p.read_text(), 'catalog-69', 'catalog-74', 1))
          p = ROOT / 'README.md'; p.write_text(replace(p.read_text(),
              '69 apps, including Veyra Workspace (Office & Productivity) and Asterion EDA\n(CAD & Manufacturing).',
              '74 apps, including Veyra Workspace, Asterion EDA, TwinForge, Branchglass,\nNotepad XP, Formalyth and Jailbreak. Open **Start → Your web apps** or search by\napp or repository name; see [the categorized collection](docs/web-apps.md).', 1))
          p = ROOT / 'docs/web-apps.md'; doc = p.read_text()
          doc = replace(doc, 'All 69 reviewed', 'All 74 reviewed', 1)
          doc = replace(doc, 'bringing the reviewed inventory to 70 repositories and the collection to 69 apps.',
              'followed by TwinForge, Branchglass, Notepad XP, Formalyth and Jailbreak.\nThe reviewed inventory now contains 75 repositories and the collection 74 apps.', 1)
          for old, new in [('CAD & Manufacturing | 8', 'CAD & Manufacturing | 9'), ('Office & Productivity | 9', 'Office & Productivity | 11'), ('Development & Data | 6', 'Development & Data | 8'), ('not all 69 application payloads', 'not all 74 application payloads')]:
              doc = replace(doc, old, new, 1)
          doc = replace(doc, 'Both are searchable by their spaced app titles and repository names. They use',
          '''- **TwinForge**: Office & Productivity. Dual-pane file management and archives.
          - **Notepad XP** (`NotepadXP`): Office & Productivity. Classic plain-text editor.
          - **Branchglass**: Development & Data. Git history, branches, staging and diffs.
            Its Pages application starts in sandbox mode; the optional native Git backend
            is not installed, connected or supplied by Aster.
          - **Jailbreak**: Development & Data. C#, XAML and MSIL compiler toolchain and IDE;
            it is not a game or a device-jailbreaking tool.
          - **Formalyth**: CAD & Manufacturing. Design and manufacturing workbench.
          
          None of these five additions receives camera, microphone, screen-capture or
          geolocation delegation. Native folder dialogs and other host-reserved features
          may require **Open in browser**; Aster does not bypass browser restrictions.
          
          All entries are searchable by their app titles and repository names. They use''', 1)
          doc = replace(doc, 'Launching either site does not preload the other one.', 'Launching an app does not preload the other sites.', 1)
          p.write_text(doc)
          
          p = ROOT / 'tests/web-apps/catalog.cjs'; code = p.read_text()
          code = replace(code, 'inventory.repositories.length, 70', 'inventory.repositories.length, 75', 1)
          code = re.sub(r'\b69\b', '74', code)
          code += '''
          
          test('The five requested tools are unique, categorized and searchable without added media access', () => {
              const {apps} = register();
              const requested = [
                  ['TwinForge', 'TwinForge', 'office'],
                  ['Branchglass', 'Branchglass', 'development'],
                  ['NotepadXP', 'Notepad XP', 'office'],
                  ['Formalyth', 'Formalyth', 'cad'],
                  ['Jailbreak', 'Jailbreak', 'development']
              ];
              const permitted = launcher.match(/const recordingApps = new Set\\(\\[([^\\]]+)\\]\\)/)[1];
              for (const [repo, title, category] of requested) {
                  const matches = catalog.apps.filter(a => a.repo === repo);
                  assert.equal(matches.length, 1);
                  const app = matches[0];
                  assert.equal(app.title, title); assert.equal(app.category, category);
                  assert.equal(app.id, 'web-' + repo.toLowerCase());
                  const registered = apps.get(app.id);
                  assert.equal(registered.webApp, true);
                  assert(registered.keywords.includes(repo));
                  assert(!permitted.includes("'" + repo + "'"));
              }
          });
          '''
          p.write_text(code)
          p = ROOT / 'tests/web-apps/browser.py'; code = re.sub(r'\b69\b', '74', p.read_text())
          code = replace(code, '.search-result").length===8', '.search-result").length===9', 1)
          code = replace(code, ".count('CAD & Manufacturing')==8", ".count('CAD & Manufacturing')==9", 1)
          code = replace(code, "('AsterionEDA','Asterion EDA','cad')]:", "('AsterionEDA','Asterion EDA','cad'),('TwinForge','TwinForge','office'),('Branchglass','Branchglass','development'),('NotepadXP','Notepad XP','office'),('Formalyth','Formalyth','cad'),('Jailbreak','Jailbreak','development')]:", 1)
          code = replace(code, "'VeyraWorkspace','AsterionEDA']:page.screenshot", "'VeyraWorkspace','AsterionEDA','TwinForge','Branchglass','NotepadXP','Formalyth','Jailbreak']:page.screenshot", 1)
          code = replace(code, 'Both requested apps have', 'All seven requested apps have', 1)
          p.write_text(code)
          # Keep inherited regressions aligned before testing/committing, not after Pages fails.
          for name in ['tests/smoke.py', 'tests/desktop-features/browser.py', 'tests/integrated-shell/browser.py', 'tests/integrated-shell/README.md']:
              p = ROOT / name; text = p.read_text(); assert re.search(r'\b69\b', text), name
              p.write_text(re.sub(r'\b69\b', '74', text))
          p = ROOT / 'tests/web-apps/README.md'; text = p.read_text()
          text = replace(text, 'the eight inventory', 'the ten inventory', 1)
          text = replace(text, 'the eleven HTTP-served', 'the twelve HTTP-served', 1)
          p.write_text(re.sub(r'\b69\b', '74', text))
          # Workflow files are finalized separately through the user's GitHub connection.
          # GITHUB_TOKEN may write source, but must not rewrite .github/workflows.
          output = ROOT / 'tests/web-apps/artifacts'; output.mkdir(parents=True, exist_ok=True)
          (output / 'requested-five-audit.json').write_text(json.dumps(audits, ensure_ascii=False, indent=2) + '\n')
          PYTHON
      - name: Await the actual return-to-desktop resize before reopening Start
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('tests/web-apps/browser.py')
          text=p.read_text()
          old="close_all();page.set_viewport_size({'width':1440,'height':1000})"
          new="close_all();page.evaluate('window.webResizeBack=false;window.addEventListener(\"resize\",()=>window.webResizeBack=true,{once:true})');page.set_viewport_size({'width':1440,'height':1000});page.wait_for_function('window.webResizeBack && innerWidth===1440')"
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PYTHON
      - name: Validate source, catalog and rebuilt standalone
        run: |
          for file in src/*.js sw.js; do node --check "$file"; done
          python3 build.py
          node --test tests/web-apps/catalog.cjs tests/integrated-shell/contracts.cjs
          python3 -m py_compile tests/web-apps/browser.py tests/smoke.py tests/desktop-features/browser.py tests/integrated-shell/browser.py
          git diff --check
      - name: Install browser verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers xvfb xauth
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Verify categorized search and Aster windows with inert host fixtures
        run: python3 tests/web-apps/browser.py
      - name: Launch all 74 actual deployed applications without fixtures
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python3 tests/web-apps/browser.py --live --gpu --headed
      - name: Check desktop and shell regressions against the expanded collection
        run: |
          python3 tests/smoke.py
          python3 tests/integrated-shell/browser.py
          python3 tests/desktop-features/browser.py
      - name: Commit verified source and standalone directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-app-catalog.js docs/web-app-inventory.json docs/web-apps.md README.md sw.js Aster.html tests/web-apps/catalog.cjs tests/web-apps/browser.py tests/web-apps/README.md tests/smoke.py tests/integrated-shell/browser.py tests/integrated-shell/README.md tests/desktop-features/browser.py
          git diff --cached --stat
          git commit -m 'Add TwinForge, Branchglass, Notepad XP, Formalyth and Jailbreak to Aster web apps'
          git push origin HEAD:main
          git rev-parse HEAD > tests/web-apps/artifacts/commit.txt
          git archive --format=zip HEAD -o tests/web-apps/artifacts/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-requested-web-apps-evidence
          path: |
            tests/web-apps/artifacts/
            tests/results.json
            tests/integrated-shell/artifacts/results.json
            tests/desktop-features/artifacts/browser-results.json
            Aster.html
          retention-days: 14
