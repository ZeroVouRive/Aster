name: Finish asynchronous picker navigation
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/fix-file-picker-navigation.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed runtime fix and delayed-real-read regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,json,hashlib
          packed=base64.b64decode('',validate=True)
          assert hashlib.sha256(packed).hexdigest()=='6dcb75f60708be8a7d3eb6379387e6e13f5e6b4e270c20a325a287d921354e33'
          decoder=zlib.decompressobj();raw=decoder.decompress(packed,5240)
          assert decoder.eof and not decoder.unused_data and len(raw)==5239
          assert hashlib.sha256(raw).hexdigest()=='58482bb7b43be996de654de6b6291ef730b4f0f5c07135c3248de21d3db1d52e'
          changes=json.loads(raw);assert {c['path'] for c in changes}=={'src/web-io-host.js','tests/web-io/review_checks.py','sw.js'}
          for c in changes:
              p=Path(c['path']);data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==c['before'],str(p)
              text=data.decode()
              for old,new in c['pairs']:
                  assert text.count(old)==1,(str(p),old)
                  text=text.replace(old,new)
              data=text.encode();assert hashlib.sha256(data).hexdigest()==c['after'],str(p)
              p.write_bytes(data)
          PY
          node --check src/web-io-host.js
          python3 -m py_compile tests/web-io/*.py
          python3 build.py
          node --test tests/web-io/models.cjs
          git diff --check
      - name: Commit source and rebuilt standalone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-io-host.js tests/web-io/review_checks.py sw.js Aster.html
          git commit -m 'Prevent stale folder lookups and listings from replacing newer picker input or errors'
          git push origin HEAD:feat/web-file-portal
