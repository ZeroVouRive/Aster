name: Integrate verified File Portal source
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/import-file-portal.yml']
permissions:
  contents: write
concurrency:
  group: import-file-portal
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all input and output records before writing editable source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64,hashlib,json,lzma
          encoded=''.join(Path(f'.transfer/final-portal-{i}.b64').read_text().strip() for i in range(7))
          assert len(encoded)==48892,len(encoded)
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='283bb5f9431e098c320f567264102a2c738fcd8542e9a829bcbfe5d0098d6b3e'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=131947)
          assert decoder.eof and not decoder.unused_data and len(raw)==131946
          assert hashlib.sha256(raw).hexdigest()=='cfecc29d5946556c131c88a43f537975c890935d9c8e559aa2ce07e8b9b5d302'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','docs/web-file-integration.md','index.html','sdk/aster-files.js','src/apps-files.js','src/apps-web.js','src/core.js','src/shell.js','src/web-file-models.js','src/web-file-settings.js','src/web-files.css','src/web-files.js','sw.js','tests/web-files/README.md','tests/web-files/browser.py','tests/web-files/fixture.html','tests/web-files/live.py','tests/web-files/models.cjs'}
          assert len(changes)==19 and {c['path'] for c in changes}==allowed
          output=[]
          for c in changes:
              name=PurePosixPath(c['path']);p=Path(name)
              assert not name.is_absolute() and '..' not in name.parts and not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  data=c['content'].encode('utf-8')
              else:
                  old=p.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==c['before'],'Concurrent source change: '+str(p)
                  text=old.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'],'Output mismatch: '+str(p)
              output.append((p,data))
          for p,data in output:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('All 19 source records verified and integrated.')
          PY
      - name: Check source, file security models, inherited contracts and standalone build
        run: |
          for f in src/*.js src/win32/*.js sdk/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile build.py tests/web-files/*.py
          python3 build.py
          node --test tests/web-files/models.cjs tests/desktop-refinement/models.cjs tests/ui-refinement/models.cjs tests/themes/models.cjs tests/themes/win32.cjs tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit the reviewed source without rewriting workflows
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Integrate scoped web file pickers, writable streams, permissions and bidirectional transfer'
          git push origin HEAD:feat/web-file-portal
      - name: Preserve recovery diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/file-portal-diagnostics
          git diff > /tmp/file-portal-diagnostics/source.diff
          tar --exclude=.git -czf /tmp/file-portal-diagnostics/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: file-portal-import-diagnostics
          path: /tmp/file-portal-diagnostics/
          retention-days: 7
