name: Web app File Portal — scoped I/O and bidirectional transfer
on:
  pull_request:
    paths: ['src/**', 'sdk/**', 'tests/**', 'index.html', 'Aster.html', 'build.py', 'sw.js', '.github/workflows/web-files.yml', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['src/**', 'sdk/**', 'tests/web-files/**', 'index.html', 'Aster.html', 'sw.js', '.github/workflows/web-files.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-files-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source, security models and reproducible standalone
        run: |
          for file in src/*.js src/win32/*.js sdk/*.js sw.js; do node --check "$file"; done
          python -m py_compile build.py tests/web-files/*.py
          node --test tests/web-files/models.cjs
          python build.py
          git diff --exit-code -- Aster.html
          git diff --check
      - name: Install verification browser only
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real API operations, permissions, native chooser fallback and drag transfers over HTTP
        run: python tests/web-files/browser.py
      - name: Repeat against the standalone edition and reload offline
        run: python tests/web-files/browser.py --standalone --output tests/web-files/artifacts/standalone
      - name: Preserve exact tested source and standalone
        if: always()
        run: |
          mkdir -p tests/web-files/artifacts
          git archive --format=zip HEAD -o tests/web-files/artifacts/source.zip
          git rev-parse HEAD > tests/web-files/artifacts/checkout.txt
          sha256sum Aster.html > tests/web-files/artifacts/standalone.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-files-chromium-evidence
          path: |
            tests/web-files/artifacts/
            Aster.html
          retention-days: 14
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Exercise the production bridge, SDK, file bytes, native fallback and persistence
        run: python tests/web-files/browser.py --engine firefox --output tests/web-files/artifacts/firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-files-firefox-evidence
          path: tests/web-files/artifacts/firefox/
          retention-days: 14
  live-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unchanged live NotepadXP and TwinForge use actual Aster files and folders
        run: python tests/web-files/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-files-live-app-evidence
          path: tests/web-files/artifacts/live/
          retention-days: 14
