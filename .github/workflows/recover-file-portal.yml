name: Recover staged File Portal source
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/recover-file-portal.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Preserve original staging and recover complete bounded records
        run: |
          mkdir -p /tmp/file-portal-recovery
          python3 - <<'PY'
          import base64,json,lzma,hashlib
          from pathlib import Path
          parts=sorted(Path('.transfer').glob('portal-*.b64'))
          data=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(data,max_length=2*1024*1024)
          Path('/tmp/file-portal-recovery/delta.partial').write_bytes(raw)
          report={'parts':[str(p) for p in parts],'compressedSha256':hashlib.sha256(data).hexdigest(),'decodedBytes':len(raw),'complete':decoder.eof}
          Path('/tmp/file-portal-recovery/report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
          git archive --format=zip HEAD -o /tmp/file-portal-recovery/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: file-portal-source-recovery
          path: /tmp/file-portal-recovery/
          retention-days: 14
