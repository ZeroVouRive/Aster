name: Finish file verification focus and fixture setup
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/finish-file-test-focus.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact test readiness changes with all assertions retained
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changes=[
            ('tests/web-io/browser.py','0ede885b16da0cb49ca6623d31aed10ab502d32aa0811936a65fe12c63869e7d','5ca2a1dc08ad267ee1588a87f348f057ab3240017db7c4fab50b0f001b6c1182',
             "frame.locator('#text').fill('Original before revocation');assert frame.locator('#text').input_value()=='Original before revocation';",
             "frame.locator('#text').click();frame.locator('#text').fill('Original before revocation');assert frame.locator('#text').input_value()=='Original before revocation',frame.locator('#text').input_value();"),
            ('tests/web-io/review_checks.py','369780108dd762945127bffe0101c10610c01f89079fc00b569bbf73930b46f2','521d3954701f746ac95265f8b1b0dd7086166dd721a58a775dee22c2320d5ea9',
             "await OS.fs.mkdir('/Documents/App storage');await OS.fs.mkdir('/Documents/App storage/foreign-app');",
             "if(!await OS.fs.stat('/Documents/App storage'))await OS.fs.mkdir('/Documents/App storage');assert((await OS.fs.stat('/Documents/App storage')).kind==='directory');await OS.fs.mkdir('/Documents/App storage/foreign-app');")
          ]
          for name,before,after,old,new in changes:
              p=Path(name);data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==before,name
              text=data.decode();assert text.count(old)==1,name
              data=text.replace(old,new).encode();assert hashlib.sha256(data).hexdigest()==after,name
              p.write_bytes(data)
          PY
          python3 -m py_compile tests/web-io/*.py
          git diff --check
      - name: Commit reviewed tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/web-io/browser.py tests/web-io/review_checks.py
          git commit -m 'Focus the original iframe before editing and reuse existing private-storage test parent'
          git push origin HEAD:feat/web-file-portal
