name: Import complete Web Files source
on:
  push:
    branches: [feat/web-app-file-integration]
    paths: ['.github/workflows/import-web-files.yml']
permissions:
  contents: write
concurrency:
  group: import-web-files
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete bounded source delta before writing anything
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          encoded=''.join(Path(f'.transfer/io-{i}.b64').read_text().strip() for i in range(6))
          assert len(encoded)==49592, 'Incomplete encoded transfer'
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==37192
          assert hashlib.sha256(data).hexdigest()=='257c6c9460c18bcdc744f69251e8ec32b1c6f246d6d1598393f27ec9f02b0d82'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(data,max_length=128806)
          assert decoder.eof and not decoder.unused_data and len(raw)==128805
          assert hashlib.sha256(raw).hexdigest()=='9deeb2f839d5d67945f82eff9df448aa46957689b142c9697e0a0bdd269875e1'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','docs/web-files.md','index.html','src/apps-files.js','src/apps-web.js','src/core.js','src/web-io-client.js','src/web-io-host.js','src/web-io-models.js','src/web-io-shell.js','src/web-io.css','sw.js','tests/web-io/README.md','tests/web-io/browser.py','tests/web-io/fixture.html','tests/web-io/live.py','tests/web-io/models.cjs'}
          assert len(changes)==18 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  data=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent edit: '+str(p)
                  text=before.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,data))
          for p,data in outputs:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Validated and expanded all 18 editable source files.')
          PY
      - name: Check syntax, actual integration models and existing desktop contracts
        run: |
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile build.py tests/web-io/*.py
          node --test tests/web-io/models.cjs tests/desktop-refinement/models.cjs tests/ui-refinement/models.cjs tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          python3 build.py
          git diff --check
      - name: Commit real sources and remove transfer data
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Integrate scoped web-app file APIs, Aster pickers, preferences and bidirectional transfers'
          git push origin HEAD:feat/web-app-file-integration
      - name: Preserve inspectable source on failure
        if: failure()
        run: |
          mkdir -p /tmp/web-files-review
          tar --exclude=.git --exclude=.transfer -czf /tmp/web-files-review/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-files-import-diagnostics
          path: /tmp/web-files-review/
          retention-days: 7
