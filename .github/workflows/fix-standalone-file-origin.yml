name: Finish standalone file handshake origin
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/fix-standalone-file-origin.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact origin fix with origin assertions and failure diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changes=[
            ('src/web-io-host.js','9b0384c6baed42b1217212afe830a13374474c9b2f2fb605c5acdef55a065cbb','965d73189075987ccafd0b15d98ceeeb87910617470ad0485f3fc5e94e72094b',[
              ("JSON.stringify([location.origin])+';('","JSON.stringify([window.origin])+';('")]),
            ('tests/web-io/browser.py','5ca2a1dc08ad267ee1588a87f348f057ab3240017db7c4fab50b0f001b6c1182','aee7717cae418e82630902f18740261fa4ba7ff58b7ec2c5040da73e7856c6d1',[
              ("ctx=browser.new_context(viewport={'width':1440,'height':1000},accept_downloads=True,service_workers='allow');page=ctx.new_page();","ctx=browser.new_context(viewport={'width':1440,'height':1000},accept_downloads=True,service_workers='allow');ctx.add_init_script(\"window.ioHandshake=[];addEventListener('message',e=>{if(e.data?.type?.startsWith('aster-io-')&&ioHandshake.length<12)ioHandshake.push({type:e.data.type,origin:e.origin,parent:e.source===parent,ports:e.ports.length});});\");page=ctx.new_page();"),
              ('   def opening():\n','   def opening():\n    assert frame.evaluate(\'ASTER_FILE_HOST_ORIGINS\')==[page.evaluate(\'window.origin\')]\n'),
              ("  except Exception as e:report['status']='FAIL';report['error']=str(e);raise",'\n'.join([
                '  except Exception as e:',
                "   report['status']='FAIL';report['error']=str(e)",
                '   try:',
                "    report['bootstrapDiagnostics']=page.evaluate('({url:location.href,environmentOrigin:window.origin,urlOrigin:location.origin,sessions:Aster.webIO?.sessions,messages:window.ioHandshake})')",
                "    report['frameDiagnostics']=[f.evaluate('({url:location.href,environmentOrigin:window.origin,urlOrigin:location.origin,allowed:window.ASTER_FILE_HOST_ORIGINS,connected:window.AsterFiles?.connected,messages:window.ioHandshake})') for f in page.frames]",
                "    page.screenshot(path=str(out/'failure.png'))",
                "   except Exception as detail:report['diagnosticError']=str(detail)",
                '   raise']))]),
            ('sw.js','0fe3cbc89c5bb5c8d79e56240b612e1eb66334ab5db31b648bda422567891138','9f0c8065f0c0fb2bffd57fcec24ac5e9a082dbf43ce11b552374aa8a262af499',[
              ('aster-desktop-2.0-files-reviewed-2','aster-desktop-2.0-files-reviewed-3')])
          ]
          output=[]
          for name,before,after,pairs in changes:
              p=Path(name);data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==before,name
              text=data.decode()
              for old,new in pairs:
                  assert text.count(old)==1,(name,old)
                  text=text.replace(old,new)
              data=text.encode();assert hashlib.sha256(data).hexdigest()==after,name
              output.append((p,data))
          for p,data in output:p.write_bytes(data)
          PY
          node --check src/web-io-host.js
          python3 -m py_compile tests/web-io/*.py
          python3 build.py
          node --test tests/web-io/models.cjs
          git diff --check
      - name: Commit origin fix and rebuilt standalone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-io-host.js tests/web-io/browser.py sw.js Aster.html
          git commit -m 'Match file-channel offers against the environment origin, not the URL origin'
          git push origin HEAD:feat/web-file-portal
