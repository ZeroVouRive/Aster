name: Import Aster source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/ready']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify and expand the original source archive
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, lzma, shutil, tarfile
          root = Path.cwd()
          folder = root / '.bootstrap'
          manifest = json.loads((folder / 'manifest.json').read_text())
          encoded = ''.join((folder / f'part-{i:02d}.b64').read_text().strip() for i in range(manifest['parts']))
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == manifest['bytes'], 'Archive length mismatch'
          assert hashlib.sha256(archive).hexdigest() == manifest['archive_sha256'], 'Archive checksum mismatch'
          expected = manifest['files']
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)), mode='r:') as tar:
              members = tar.getmembers()
              assert {member.name for member in members} == set(expected), 'Unexpected archive members'
              assert len(members) == len(expected), 'Duplicate archive members'
              for member in members:
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert not member.name.startswith('.'), 'Hidden source path rejected'
                  data = tar.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest() == expected[member.name], member.name
                  destination = root / member.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  destination.chmod(member.mode & 0o777)
          shutil.rmtree(folder)
          print(f'Verified and imported {len(expected)} source files.')
          PY
      - name: Retain the validated resize synchronization in smoke tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/smoke.py')
          source = path.read_text()
          old = "await page.set_viewport_size({'width':390,'height':844});await page.evaluate('Aster.toggleStart()')"
          new = "await page.set_viewport_size({'width':390,'height':844})\n            # Let the resize handler dismiss panels before opening Start.\n            await page.evaluate('new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))')\n            await page.evaluate('Aster.toggleStart()')"
          assert source.count(old) == 1, 'Expected exactly one test synchronization point'
          path.write_text(source.replace(old, new))
          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('## Start\n', '## Start\n\n### GitHub Pages\n\n[Open Aster Desktop](https://wieslawsoltes.github.io/Aster/) · [Standalone HTML](https://wieslawsoltes.github.io/Aster/Aster.html)\n\nThe hosted edition uses HTTPS and the same local-first application source. Files remain in your browser workspace; GitHub Pages does not receive your virtual files.\n', 1)
          readme.write_text(text)
          PY
      - name: Validate JavaScript and rebuild the standalone edition
        run: |
          for file in src/*.js sw.js; do node --check "$file"; done
          python3 -m py_compile tests/smoke.py build.py start.py
          python3 build.py
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          print('Standalone SHA-256:', hashlib.sha256(Path('Aster.html').read_bytes()).hexdigest())
          PY
      - name: Commit the expanded application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add Aster Desktop with 18 apps, WebGPU renderer, tests and standalone build"
          git push origin HEAD:main
