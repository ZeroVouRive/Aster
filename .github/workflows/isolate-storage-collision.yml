name: Isolate private storage collision fixture
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/isolate-storage-collision.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Use a separate app scope without deleting earlier stored test files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/web-io/review_checks.py');data=p.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='521d3954701f746ac95265f8b1b0dd7086166dd721a58a775dee22c2320d5ea9'
          text=data.decode();start=text.index('    def storage_collision():');end=text.index("    check('Security: existing file",start)
          section=text[start:end];assert section.count('io-fixture')==6
          data=(text[:start]+section.replace('io-fixture','io-collision-fixture')+text[end:]).encode()
          assert hashlib.sha256(data).hexdigest()=='339bd993a9f098b8134eb661d9a1d938f5ba166f06d7b4d4d3ec7a0d41261f84'
          p.write_bytes(data)
          PY
          python3 -m py_compile tests/web-io/*.py
          git diff --check
      - name: Commit fixture correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/web-io/review_checks.py
          git commit -m 'Isolate occupied private-root regression from existing successful app storage'
          git push origin HEAD:feat/web-file-portal
