name: Add requested web apps with verified deployment evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-reviewed-web-apps.yml']
permissions:
  contents: write
concurrency:
  group: add-reviewed-web-apps
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit both live deployments and update catalog, tests and documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, hashlib, html, json, os, re, urllib.request
          from zoneinfo import ZoneInfo
          root = Path.cwd()
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          def get(url, limit=8*1024*1024):
              headers = {'User-Agent':'Aster-reviewed-catalog-update','Accept':'application/vnd.github+json' if url.startswith('https://api.github.com/') else '*/*'}
              if url.startswith('https://api.github.com/'):
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=40) as response:
                  data = response.read(limit+1)
                  assert len(data) <= limit, 'Response exceeds bound'
                  return data, response.status, response.url, {k.lower():v for k,v in response.headers.items()}
          def edit(path, before, after):
              p=root/path; text=p.read_text()
              assert before in text, 'Expected source changed: '+path
              p.write_text(text.replace(before,after))
          specs=[
              {'repo':'VeyraWorkspace','title':'Veyra Workspace','description':'Collaboration workspace with chat, meetings, shared notes and a WebGPU whiteboard','category':'office'},
              {'repo':'AsterionEDA','title':'Asterion EDA','description':'Electronic design automation and circuit design workbench','category':'cad'},
          ]
          p=root/'src/web-app-catalog.js';text=p.read_text();start=text.index('    const data = ')+len('    const data = ');end=text.index('\n};',start)+2
          catalog=json.loads(text[start:end]);inventory=json.loads((root/'docs/web-app-inventory.json').read_text())
          assert len(catalog['apps'])==67 and len(inventory['repositories'])==68
          for spec in specs:
              repo=spec['repo'];url='https://wieslawsoltes.github.io/'+repo+'/'
              assert not any(a['repo']==repo for a in catalog['apps'])
              meta=json.loads(get('https://api.github.com/repos/wieslawsoltes/'+repo)[0])
              readme=json.loads(get('https://api.github.com/repos/wieslawsoltes/'+repo+'/readme')[0])
              data,status,final,headers=get(url)
              assert meta['owner']['login']=='wieslawsoltes' and not meta['private'] and not meta['fork']
              assert status==200 and final==url and 'text/html' in headers.get('content-type','')
              assert not headers.get('x-frame-options'), headers
              assert 'frame-ancestors' not in headers.get('content-security-policy','').lower(), headers
              match=re.search(r'<title\b[^>]*>(.*?)</title>',data.decode('utf-8'),re.S|re.I);assert match
              title=html.unescape(match.group(1)).strip();assert title and not title.startswith('Site not found')
              app={**spec,'createdAt':meta['created_at'],'url':url,'documentTitle':title}
              position=max(i for i,a in enumerate(catalog['apps']) if a['category']==spec['category'])+1
              catalog['apps'].insert(position,app)
              inventory['repositories'].append({'name':repo,'createdAt':meta['created_at'],'createdLocal':datetime.datetime.fromisoformat(meta['created_at'].replace('Z','+00:00')).astimezone(ZoneInfo('Europe/Warsaw')).isoformat(),'repository':'https://github.com/wieslawsoltes/'+repo,'readmeSHA':readme['sha'],'included':True,'reason':'User-requested addition to the reviewed web-app collection.','auditedAt':now,'deployments':[{'requestedUrl':url,'status':status,'finalUrl':final,'headers':{k:v for k,v in headers.items() if k in ['content-type','x-frame-options','content-security-policy','permissions-policy']},'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'title':title}]})
              print(repo, spec['category'],status,title)
          catalog['version']=2;catalog['updatedAt']=now
          inventory['updatedAt']=now;inventory['repositories'].sort(key=lambda a:a['name'])
          p.write_text(text[:start]+json.dumps(catalog,indent=2,ensure_ascii=False)+text[end:])
          (root/'docs/web-app-inventory.json').write_text(json.dumps(inventory,indent=2,ensure_ascii=False)+'\n')
          edit('src/apps-web.js',"'SonoraStudio', 'SignalForgeStudio'","'SonoraStudio', 'SignalForgeStudio', 'VeyraWorkspace'")
          edit('tests/web-apps/catalog.cjs','inventory.repositories.length, 68','inventory.repositories.length, 70')
          edit('tests/web-apps/catalog.cjs',', 67)',', 69)')
          p=root/'tests/web-apps/catalog.cjs'
          p.write_text(p.read_text()+'''\ntest('Requested Veyra Workspace and Asterion EDA entries keep their category and media scope', () => {
              const {apps} = register();
              for (const [repo, title, category] of [
                  ['VeyraWorkspace', 'Veyra Workspace', 'office'],
                  ['AsterionEDA', 'Asterion EDA', 'cad']
              ]) {
                  const app = catalog.apps.find(a => a.repo === repo);
                  assert(app); assert.equal(app.title, title); assert.equal(app.category, category);
                  assert.equal(app.id, 'web-' + repo.toLowerCase());
                  assert.equal(apps.get(app.id).webApp, true);
                  assert(apps.get(app.id).keywords.includes(repo));
              }
              const permitted = launcher.match(/const recordingApps = new Set\\(\\[([^\\]]+)\\]\\)/)[1];
              assert(permitted.includes("'VeyraWorkspace'"));
              assert(!permitted.includes("'AsterionEDA'"));
          });
          ''')
          edit('tests/web-apps/browser.py','67','69')
          edit('tests/web-apps/browser.py','length===7','length===8')
          edit('tests/web-apps/browser.py',"count('CAD & Manufacturing')==7","count('CAD & Manufacturing')==8")
          edit('tests/web-apps/browser.py',"['PaintXP','Vellum','Gridline','AxiomCAD']","['PaintXP','Vellum','Gridline','AxiomCAD','VeyraWorkspace','AsterionEDA']")
          edit('tests/web-apps/browser.py',"            def standalone():",'''            def requested_apps():
                          for repo,title,category in [('VeyraWorkspace','Veyra Workspace','office'),('AsterionEDA','Asterion EDA','cad')]:
                              close_all();web_index();page.locator('[data-web-category="'+category+'"]').click()
                              assert page.locator('[data-web-app="web-'+repo.lower()+'"]').inner_text().startswith(title)
                              query=page.get_by_role('textbox',name='Search apps and files');query.fill(repo)
                              page.get_by_role('button',name=title+' App',exact=False).click()
                              current_frame().get_by_role('heading',name='Window behavior fixture').wait_for()
                              frame=page.locator('.web-app-frame');assert frame.get_attribute('src')=='https://wieslawsoltes.github.io/'+repo+'/'
                              policy=frame.get_attribute('allow')
                              for feature in ['microphone','camera','display-capture']:assert (feature in policy)==(repo=='VeyraWorkspace')
                              window=page.locator('.window[data-app="web-'+repo.lower()+'"]')
                              assert window.locator('.window-title').inner_text()==title
                              window.get_by_role('button',name='Minimize',exact=True).click()
                              page.locator('.task-button[data-app="web-'+repo.lower()+'"]').click()
                              assert 'minimized' not in window.get_attribute('class')
                              page.screenshot(path=str(out/(repo+'-host-fixture.png')))
                          close_all();return 'Both requested apps have categorized/searchable entries, canonical frames, titlebars and scoped media delegation'
                      check('Requested apps launch from Start with correct chrome and permissions',requested_apps)
                      def standalone():''')
          edit('docs/web-apps.md','All 67 reviewed external','All 69 reviewed external')
          edit('docs/web-apps.md','**not all 67 application payloads**','**not all 69 application payloads**')
          edit('docs/web-apps.md','68 candidate repositories were found; 67 external apps are included. **Aster','The original audit found 68 candidate repositories and included 67 external apps.\nVeyra Workspace and Asterion EDA were subsequently added at the owner\'s request,\nbringing the reviewed inventory to 70 repositories and the collection to 69 apps.\nTheir individual audit timestamps and live response evidence are retained. **Aster')
          edit('docs/web-apps.md','| CAD & Manufacturing | 7 |','| CAD & Manufacturing | 8 |')
          edit('docs/web-apps.md','| Office & Productivity | 8 |','| Office & Productivity | 9 |')
          edit('docs/web-apps.md','Recording apps additionally receive camera,','Recording and collaboration/calling apps additionally receive camera,')
          edit('docs/web-apps.md','## Hosting, permissions and trust','''## Requested additions

          - **Veyra Workspace**: Office & Productivity. Local collaboration workspace,
            notes, meetings and whiteboard. Camera, microphone and screen sharing are
            delegated to its iframe but still require browser permission. Static Pages
            hosting does not supply Veyra's optional live collaboration server.
          - **Asterion EDA**: CAD & Manufacturing. Electronic design automation workbench.
            Its frame does not receive camera, microphone or screen-capture delegation.

          Both are searchable by their spaced app titles and repository names. They use
          Aster's existing window controls, taskbar entries, Reload, Source and Open in
          browser actions. Launching either site does not preload the other one.

          ## Hosting, permissions and trust''')
          edit('tests/web-apps/README.md','all 67 real deployed projects','all 69 real deployed projects')
          edit('README.md','the 67 categorized web apps remain unchanged.','the categorized web-app collection remain available. The collection now contains\n69 apps, including Veyra Workspace (Office & Productivity) and Asterion EDA\n(CAD & Manufacturing).')
          p=root/'sw.js';t=p.read_text();match=re.search(r"(const CACHE\s*=\s*['\"])([^'\"]+)(['\"])",t)
          assert match,'Cache declaration changed'
          t=t[:match.start(2)]+match.group(2)+'-catalog-69'+t[match.end(2):];p.write_text(t)
          PY
      - name: Validate catalog, JavaScript and rebuilt standalone edition
        run: |
          for file in src/*.js sw.js; do node --check "$file"; done
          python3 -m py_compile tests/web-apps/browser.py
          python3 build.py
          node --test tests/web-apps/catalog.cjs
          git diff --check
      - name: Install browser verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers xvfb xauth
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Verify Start search, categories, window controls and scoped media permissions
        run: python3 tests/web-apps/browser.py
      - name: Verify all 69 real deployed applications including both additions
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python3 tests/web-apps/browser.py --live --gpu --headed
      - name: Commit verified editable source and standalone directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-app-catalog.js src/apps-web.js docs/web-app-inventory.json docs/web-apps.md tests/web-apps/catalog.cjs tests/web-apps/browser.py tests/web-apps/README.md README.md sw.js Aster.html
          git commit -m 'Add Veyra Workspace and Asterion EDA to the categorized web-app collection'
          git push origin HEAD:main
          git rev-parse HEAD > tests/web-apps/artifacts/commit.txt
          git archive --format=zip HEAD -o tests/web-apps/artifacts/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-web-apps-evidence
          path: |
            tests/web-apps/artifacts/
            Aster.html
          retention-days: 14
