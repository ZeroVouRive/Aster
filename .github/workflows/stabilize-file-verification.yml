name: Stabilize file integration verification
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/stabilize-file-verification.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact reviewed test changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/web-io/browser.py');data=p.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='d495094983d8f724e02c9f0ec3a49a094524f4e9d7fd801485676705a44a9cd1'
          text=data.decode()
          changes=[
              ('source.scroll_into_view_if_needed();b=source.bounding_box();','source.click(trial=True);b=source.bounding_box();'),
              ("frame.locator('#text').fill('');frame.locator('#save').click();","frame.locator('#text').fill('Original before revocation');assert frame.locator('#text').input_value()=='Original before revocation';frame.locator('#save').click();"),
              ('js("assert((await OS.fs.read(\'/Documents/IO/revoked.txt\')).size===0);")','js("assert(await OS.fs.text(await OS.fs.read(\'/Documents/IO/revoked.txt\'))===\'Original before revocation\',\'Revocation must preserve the committed original bytes\');")')
          ]
          for old,new in changes:
              assert text.count(old)==1,old
              text=text.replace(old,new)
          data=text.encode();assert hashlib.sha256(data).hexdigest()=='0ede885b16da0cb49ca6623d31aed10ab502d32aa0811936a65fe12c63869e7d'
          p.write_bytes(data)
          PY
          python3 -m py_compile tests/web-io/*.py
          git diff --check
      - name: Commit without changing the runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/web-io/browser.py
          git commit -m 'Wait for current Explorer drag targets and verify nonempty committed data survives revocation'
          git push origin HEAD:feat/web-file-portal
