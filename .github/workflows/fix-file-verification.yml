name: Correct file integration verification scheduling
on:
  push:
    branches: [feat/web-file-portal]
    paths: ['.github/workflows/fix-file-verification.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply checked test corrections without changing runtime or assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name,before,after,pairs):
              p=Path(name);raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==before,name
              text=raw.decode()
              for old,new in pairs:
                  assert text.count(old)==1,(name,old)
                  text=text.replace(old,new)
              raw=text.encode();assert hashlib.sha256(raw).hexdigest()==after,name
              p.write_bytes(raw)
          # TwinForge displays its chosen folder name in the volume selector;
          # the path field intentionally uses a generated local-<id>:/ prefix.
          edit('tests/web-io/live.py','1015b352a3f083690fc3112a2d0d98456b2e49e12209433fe0097298975f1cad','0c3849268c73e6075ec8aefd0415200b724a480831ff7c79f24bc8b6f3922b9f',[
              ('tf.wait_for_function(\'document.querySelector("#pane-0 .path-input").value.includes("TwinForgeBridge")\')','tf.wait_for_function(\'document.querySelector("#pane-0 .volume-bar select")?.selectedOptions[0]?.textContent==="TwinForgeBridge" && document.querySelector("#pane-0 .a11y-rows")?.textContent.includes("source.txt")\')')
          ])
          # evaluate() awaits returned Promises. Launch the request with void so
          # the test can actually click the permission dialog before awaiting it.
          edit('tests/web-io/browser.py','50024b12ccc1c43274691996ee08a30bf1625d67602f04b15e0ebd8b6c053ca2','d495094983d8f724e02c9f0ec3a49a094524f4e9d7fd801485676705a44a9cd1',[
              ('window.privateHandle=null;window.privateFailure=null;navigator.storage.getDirectory().then','window.privateHandle=null;window.privateFailure=null;void navigator.storage.getDirectory().then'),
              ("assert not f.evaluate('privateFailure');","assert not f.evaluate('privateFailure'), f.evaluate('privateFailure');"),
              ('window.privateResult=null;window.privateError=null; navigator.storage?.getDirectory ? navigator.storage.getDirectory().then(x=>window.privateResult=x,e=>window.privateError=e.name) : (window.privateError="Unavailable")','window.privateResult=null;window.privateError=null; void (navigator.storage?.getDirectory ? navigator.storage.getDirectory().then(x=>window.privateResult=x,e=>window.privateError=e.name) : (window.privateError="Unavailable"))')
          ])
          PY
          python3 -m py_compile tests/web-io/*.py
          git diff --check
      - name: Commit reviewed corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/web-io/browser.py tests/web-io/live.py
          git commit -m 'Avoid awaiting user approval before clicking it and assert actual TwinForge mount state'
          git push origin HEAD:feat/web-file-portal
