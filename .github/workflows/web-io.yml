name: Web app file integration — pickers, permissions and real transfers
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'index.html', 'Aster.html', 'build.py', 'sw.js', '.github/workflows/web-io.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/web-io/**', 'index.html', 'Aster.html', 'sw.js', '.github/workflows/web-io.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-io-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded protocol and reproducible standalone
        run: |
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python -m py_compile tests/web-io/*.py
          node --test tests/web-io/models.cjs
          python build.py
          git diff --exit-code -- Aster.html
          git diff --check
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Actual opaque/same-origin file APIs, native picker fallback and IndexedDB
        run: python tests/web-io/browser.py
      - name: Standalone file APIs and actual offline persistence
        run: python tests/web-io/browser.py --standalone --output tests/web-io/artifacts/standalone
      - name: Preserve exact tested source
        if: always()
        run: |
          mkdir -p tests/web-io/artifacts
          git archive --format=zip HEAD -o tests/web-io/artifacts/source.zip
          git rev-parse HEAD > tests/web-io/artifacts/checkout.txt
          sha256sum Aster.html > tests/web-io/artifacts/standalone.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-io-chromium-evidence
          path: |
            tests/web-io/artifacts/
            Aster.html
          retention-days: 14
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Actual standard APIs, binary writes and browser fallback in Firefox
        run: python tests/web-io/browser.py --engine firefox --output tests/web-io/artifacts/firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-io-firefox-evidence
          path: tests/web-io/artifacts/firefox/
          retention-days: 14
  live-applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test deployed applications unchanged against the proposed host source
        run: python tests/web-io/live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-io-live-applications-evidence
          path: tests/web-io/artifacts/live/
          retention-days: 14
